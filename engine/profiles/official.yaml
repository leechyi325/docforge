id: official
name: 公文
required_fields:
  - title
  - body
page:
  paper: A4
  margin_top: 3.7cm
  margin_bottom: 3.5cm
  margin_left: 2.8cm
  margin_right: 2.6cm
title:
  font: 方正小标宋
  size: 二号
  bold: false
  align: center
  line_spacing: 28pt
body:
  font: 仿宋
  size: 三号
  align: justify
  first_line_indent: 2em
  line_spacing: 28pt
  space_before: 0pt
  space_after: 0pt
headings:
  heading_1:
    font: 黑体
    size: 三号
    bold: false
    align: left
    line_spacing: 28pt
  heading_2:
    font: 楷体
    size: 三号
    bold: false
    align: left
    line_spacing: 28pt
special_sections:
  attachment:
    font: 仿宋
    size: 三号
    align: left
    line_spacing: 28pt
  signature:
    font: 仿宋
    size: 三号
    align: right
    line_spacing: 28pt
auto_fix_rules:
  - title_style
  - body_style
  - heading_style
  - page_setup
  - attachment_style
  - signature_style
template: null
